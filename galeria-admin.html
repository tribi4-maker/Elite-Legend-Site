<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Galeria — Elite Legend Academy</title>

  <!-- Favicon (aba do browser) -->
  <link rel="icon" type="image/png" sizes="32x32" href="images/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="images/favicon-16.png" />

  <!-- PWA: instalar/adicionar atalho no mobile -->
  <link rel="manifest" href="admin-manifest.json" />
  <meta name="theme-color" content="#0a0a0a" />
  <link rel="apple-touch-icon" href="images/icon-192.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Elite Legend BO" />

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --black:   #0a0a0a;
      --dark:    #111111;
      --card:    #161616;
      --border:  #2a2a2a;
      --accent:  #C9A84C;
      --accent2: #F2D06B;
      --text:    #e8e8e8;
      --muted:   #888;
    }

    html { overflow-x: hidden; }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: var(--black);
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ── Topbar ── */
    .topbar {
      position: sticky;
      top: 0;
      z-index: 10;
      background: rgba(10,10,10,.9);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: 0 40px;
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .topbar-title { font-size: 1rem; font-weight: 700; }
    .topbar-actions { display: flex; align-items: center; gap: 10px; }
    .btn-logout {
      padding: 8px 20px;
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--muted);
      font-size: .88rem;
      cursor: pointer;
      transition: border-color .2s, color .2s;
    }
    .btn-logout:hover { border-color: var(--accent); color: var(--accent); }

    .dashboard-body { padding: 24px 40px 60px; }

    /* ── Cabeçalho da secção ── */
    .pub-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 20px;
    }
    .pub-header h2 { font-size: 1.2rem; font-weight: 800; }
    .btn-novo {
      padding: 10px 20px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      color: #000;
      font-weight: 700;
      font-size: .9rem;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: opacity .2s;
    }
    .btn-novo:hover { opacity: .9; }

    /* ── Grid de cartões ── */
    .publicacoes-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 16px;
    }
    .pub-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .pub-card-img { width: 100%; aspect-ratio: 1080 / 1350; background: #0c0c0c; }
    .pub-card-img img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .pub-card-body { padding: 12px; display: flex; flex-direction: column; gap: 8px; flex: 1; }
    .pub-card-title { font-size: .84rem; font-weight: 600; line-height: 1.3; color: var(--muted); }
    .pub-actions { display: flex; gap: 8px; margin-top: auto; padding-top: 4px; }
    .btn-pub-edit, .btn-pub-archive, .btn-pub-restore {
      flex: 1; padding: 7px; border-radius: 7px; font-size: .78rem; cursor: pointer;
      border: 1px solid var(--border); background: transparent; color: var(--muted);
      transition: border-color .2s, color .2s;
    }
    .btn-pub-edit:hover    { border-color: var(--accent); color: var(--accent); }
    .btn-pub-archive:hover { border-color: #ff6b6b; color: #ff6b6b; }
    .btn-pub-restore:hover { border-color: #00c864; color: #00c864; }

    .empty {
      grid-column: 1 / -1;
      text-align: center;
      padding: 40px 20px;
      color: var(--muted);
      font-size: .9rem;
      border: 1px dashed var(--border);
      border-radius: 12px;
    }

    /* ── Secção arquivadas ── */
    .secao-arquivadas { margin-top: 36px; }
    .btn-toggle-arquivadas {
      padding: 8px 18px;
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--muted);
      font-size: .85rem;
      font-weight: 600;
      cursor: pointer;
      transition: border-color .2s, color .2s;
    }
    .btn-toggle-arquivadas:hover { border-color: var(--accent); color: var(--accent); }
    #grid-arquivadas-wrap { display: none; margin-top: 16px; }
    #grid-arquivadas-wrap.open { display: block; }

    /* ── Modal ── */
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,.75);
      display: none; align-items: center; justify-content: center;
      z-index: 200; padding: 20px;
    }
    .modal-overlay.show { display: flex; }
    .modal-box {
      background: var(--dark); border: 1px solid var(--border); border-radius: 16px;
      padding: 32px; width: 100%; max-width: 440px; max-height: 90vh; overflow-y: auto;
    }
    .modal-title { font-size: 1.1rem; font-weight: 800; margin-bottom: 20px; }
    .modal-group { display: flex; flex-direction: column; gap: 6px; margin-bottom: 16px; min-width: 0; }
    .modal-group label { font-size: .72rem; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: var(--muted); }
    .modal-group select, .modal-group input, .modal-group textarea {
      background: #1c1c1c; border: 1px solid var(--border); border-radius: 8px;
      padding: 10px 14px; color: var(--text); font-size: .95rem;
      font-family: inherit; outline: none;
    }
    .modal-group select:focus, .modal-group input:focus, .modal-group textarea:focus { border-color: var(--accent); }
    .imagem-preview-row { display: flex; align-items: center; gap: 12px; margin-top: 8px; }
    .form-imagem-preview {
      width: 90px; aspect-ratio: 1080 / 1350; object-fit: cover; border-radius: 8px;
      border: 1px solid var(--border); background: #000; flex-shrink: 0;
    }
    .btn-ajustar {
      padding: 10px 14px; border: 1px solid var(--border); border-radius: 8px;
      background: transparent; color: var(--muted); font-size: .85rem;
      cursor: pointer; white-space: nowrap; transition: border-color .2s, color .2s;
    }
    .btn-ajustar:hover { border-color: var(--accent); color: var(--accent); }
    .cropper-frame { width: 100%; aspect-ratio: 1080 / 1350; background: #000; overflow: hidden; border-radius: 8px; }
    .cropper-frame img { display: block; max-width: none; }
    .cropper-zoom-row { display: flex; align-items: center; gap: 10px; margin-top: 14px; color: var(--muted); font-size: 1rem; }
    .cropper-zoom-row input[type="range"] { flex: 1; accent-color: var(--accent); }
    .form-erro {
      display: none; margin-top: 10px; padding: 10px 14px;
      background: rgba(255,80,80,.1); border: 1px solid rgba(255,80,80,.3);
      border-radius: 8px; color: #ff6b6b; font-size: .85rem;
    }
    .form-erro.show { display: block; }
    .modal-actions { display: flex; gap: 10px; margin-top: 20px; }
    .btn-modal-cancel {
      flex: 1; padding: 11px; background: transparent; border: 1px solid var(--border);
      border-radius: 8px; color: var(--muted); cursor: pointer; font-size: .9rem;
    }
    .btn-modal-save {
      flex: 2; padding: 11px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      color: #000; font-weight: 700; border: none; border-radius: 8px;
      cursor: pointer; font-size: .9rem;
    }
    .btn-modal-save:disabled { opacity: .6; cursor: not-allowed; }
    .btn-modal-rejeitar {
      flex: 2; padding: 11px; background: transparent; border: 1px solid #ff6b6b;
      border-radius: 8px; color: #ff6b6b; font-weight: 700; cursor: pointer; font-size: .9rem;
    }

    @media (max-width: 600px) {
      .topbar { padding: 0 16px; }
      .topbar-title { font-size: .88rem; }
      .topbar-actions { gap: 6px; }
      .topbar-actions .btn-logout { padding: 8px 12px; font-size: .78rem; }
      .dashboard-body { padding: 20px; }
      .publicacoes-grid { grid-template-columns: repeat(3, 1fr); gap: 10px; }
    }
  </style>
</head>
<body>

  <div class="topbar">
    <div class="topbar-title" id="topbar-title">Galeria</div>
    <div class="topbar-actions">
      <button class="btn-logout" onclick="window.location.href='admin.html'">← Voltar ao Backoffice</button>
      <button class="btn-logout" id="btn-logout">Sair</button>
    </div>
  </div>

  <div class="dashboard-body">
    <div class="pub-header">
      <h2 id="secao-titulo">Fotos</h2>
      <button class="btn-novo" id="btn-novo" onclick="abrirNovo()">+ Adicionar</button>
    </div>

    <div class="publicacoes-grid" id="grid-ativas">
      <div class="empty">A carregar...</div>
    </div>

    <div class="secao-arquivadas">
      <button class="btn-toggle-arquivadas" id="btn-toggle-arquivadas" onclick="document.getElementById('grid-arquivadas-wrap').classList.toggle('open')">
        Arquivadas (0)
      </button>
      <div id="grid-arquivadas-wrap">
        <div class="publicacoes-grid" id="grid-arquivadas">
          <div class="empty">—</div>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal: Adicionar/Editar -->
  <div class="modal-overlay" id="modal-form">
    <div class="modal-box">
      <div class="modal-title" id="modal-form-title">Adicionar</div>

      <div class="modal-group">
        <label>Imagem</label>
        <input type="file" id="form-imagem" accept="image/*" />
        <div class="imagem-preview-row" id="imagem-preview-row" style="display:none;">
          <img class="form-imagem-preview" id="form-imagem-preview" alt="Pré-visualização" />
          <button type="button" class="btn-ajustar" onclick="abrirCropper(imagemAtualUrl)">Ajustar enquadramento</button>
        </div>
      </div>

      <div class="modal-group">
        <label id="label-nome">Legenda</label>
        <input type="text" id="form-nome" placeholder="" />
      </div>

      <div class="form-erro" id="form-erro"></div>

      <div class="modal-actions">
        <button class="btn-modal-cancel" onclick="fecharForm()">Cancelar</button>
        <button class="btn-modal-save" id="btn-guardar-form" onclick="guardarItem()">Guardar</button>
      </div>
    </div>
  </div>

  <!-- Modal: Confirmar Arquivar -->
  <div class="modal-overlay" id="modal-confirmar">
    <div class="modal-box" style="max-width:400px;">
      <div class="modal-title">Arquivar</div>
      <p style="color:var(--muted);font-size:.92rem;line-height:1.6;">
        Deixa de aparecer no site. Podes restaurar mais tarde a partir das Arquivadas.
      </p>
      <div class="modal-actions">
        <button class="btn-modal-cancel" onclick="fecharConfirmar()">Cancelar</button>
        <button class="btn-modal-rejeitar" onclick="arquivarConfirmado()">Arquivar</button>
      </div>
    </div>
  </div>

  <!-- Modal: Ajustar Imagem (arrastar / zoom) -->
  <div class="modal-overlay" id="modal-cropper">
    <div class="modal-box" style="max-width:460px;">
      <div class="modal-title">Ajustar Imagem</div>
      <div class="cropper-frame">
        <img id="cropper-img" src="" alt="" />
      </div>
      <div class="cropper-zoom-row">
        <span>－</span>
        <input type="range" id="cropper-zoom" min="0" max="200" value="100" />
        <span>＋</span>
      </div>
      <p style="font-size:.74rem;color:var(--muted);">Arrasta a imagem para escolher o que fica visível. O que não couber no quadro fica a preto.</p>
      <div class="modal-actions">
        <button class="btn-modal-cancel" onclick="cancelarCropper()">Cancelar</button>
        <button class="btn-modal-cancel" onclick="resetarCropper()">Repor</button>
        <button class="btn-modal-save" onclick="aplicarCropper()">Aplicar</button>
      </div>
    </div>
  </div>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/cropperjs@1.6.2/dist/cropper.min.css" />
  <script src="https://cdn.jsdelivr.net/npm/cropperjs@1.6.2/dist/cropper.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase.js"></script>
  <script>
    const CONFIGS = {
      atletas: {
        titulo: 'Plantel',
        itemSingular: 'Atleta',
        tabela: 'atletas',
        bucket: 'atletas',
        labelNome: 'Legenda (texto alternativo)',
        placeholderNome: 'Ex: Atleta Elite Legend Academy',
        nomePadrao: 'Atleta Elite Legend Academy',
      },
      patrocinadores: {
        titulo: 'Patrocinadores',
        itemSingular: 'Patrocinador',
        tabela: 'patrocinadores',
        bucket: 'patrocinadores',
        labelNome: 'Nome do Patrocinador',
        placeholderNome: 'Ex: beCenter',
        nomePadrao: 'Patrocinador Elite Legend Academy',
      },
    };

    const params = new URLSearchParams(window.location.search);
    const cfg = CONFIGS[params.get('tipo')];

    if (!cfg) {
      document.body.innerHTML =
        '<div style="padding:60px 20px;text-align:center;color:#888;">Página inválida. Volta ao <a href="admin.html" style="color:#C9A84C;">Backoffice</a>.</div>';
      throw new Error('Parâmetro "tipo" inválido ou em falta.');
    }

    document.title = `${cfg.titulo} — Elite Legend Academy`;
    document.getElementById('topbar-title').textContent = cfg.titulo;
    document.getElementById('secao-titulo').textContent = cfg.titulo;
    document.getElementById('btn-novo').textContent = `+ Adicionar ${cfg.itemSingular}`;
    document.getElementById('modal-form-title').textContent = `Adicionar ${cfg.itemSingular}`;
    document.getElementById('label-nome').textContent = cfg.labelNome;
    document.getElementById('form-nome').placeholder = cfg.placeholderNome;

    const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON);

    let itemsCache     = [];
    let editandoId     = null;
    let ficheiroImagem = null;
    let imagemAtualUrl = null;
    let idParaArquivar = null;

    sb.auth.getSession().then(({ data }) => {
      if (!data.session) {
        window.location.href = 'admin.html';
        return;
      }
      carregarItems();
    });

    document.getElementById('btn-logout').addEventListener('click', async () => {
      await sb.auth.signOut();
      window.location.href = 'admin.html';
    });

    function escapeHtml(str) {
      return String(str).replace(/[&<>"']/g, c => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
      }[c]));
    }

    async function carregarItems() {
      const { data, error } = await sb.from(cfg.tabela).select('*').order('id', { ascending: true });
      if (error) {
        document.getElementById('grid-ativas').innerHTML = '<div class="empty">Erro ao carregar.</div>';
        return;
      }
      itemsCache = data;
      renderListas();
    }

    function cardHtml(item) {
      const acao = item.ativo
        ? `<button class="btn-pub-archive" onclick="confirmarArquivar(${item.id})">Arquivar</button>`
        : `<button class="btn-pub-restore" onclick="restaurar(${item.id})">Restaurar</button>`;
      return `
        <div class="pub-card">
          <div class="pub-card-img"><img src="${escapeHtml(item.imagem_url)}" alt="" loading="lazy" /></div>
          <div class="pub-card-body">
            <h3 class="pub-card-title">${escapeHtml(item.legenda || '')}</h3>
            <div class="pub-actions">
              <button class="btn-pub-edit" onclick="abrirEditar(${item.id})">Editar</button>
              ${acao}
            </div>
          </div>
        </div>
      `;
    }

    function renderListas() {
      const ativos     = itemsCache.filter(i => i.ativo);
      const arquivados = itemsCache.filter(i => !i.ativo);

      document.getElementById('grid-ativas').innerHTML = ativos.length
        ? ativos.map(cardHtml).join('')
        : '<div class="empty">Ainda não há fotos.</div>';

      document.getElementById('btn-toggle-arquivadas').textContent = `Arquivadas (${arquivados.length})`;
      document.getElementById('grid-arquivadas').innerHTML = arquivados.length
        ? arquivados.map(cardHtml).join('')
        : '<div class="empty">Sem fotos arquivadas.</div>';
    }

    // ── Formulário (adicionar/editar) ──
    function abrirNovo() {
      editandoId = null;
      ficheiroImagem = null;
      imagemAtualUrl = null;
      document.getElementById('form-nome').value = '';
      document.getElementById('form-imagem').value = '';
      document.getElementById('imagem-preview-row').style.display = 'none';
      document.getElementById('modal-form-title').textContent = `Adicionar ${cfg.itemSingular}`;
      document.getElementById('form-erro').classList.remove('show');
      document.getElementById('modal-form').classList.add('show');
    }

    function abrirEditar(id) {
      const item = itemsCache.find(x => x.id === id);
      if (!item) return;
      editandoId = id;
      ficheiroImagem = null;
      imagemAtualUrl = item.imagem_url;
      document.getElementById('form-nome').value = item.legenda || '';
      document.getElementById('form-imagem').value = '';
      document.getElementById('form-imagem-preview').src = item.imagem_url;
      document.getElementById('imagem-preview-row').style.display = 'flex';
      document.getElementById('modal-form-title').textContent = `Editar ${cfg.itemSingular}`;
      document.getElementById('form-erro').classList.remove('show');
      document.getElementById('modal-form').classList.add('show');
    }

    function fecharForm() {
      document.getElementById('modal-form').classList.remove('show');
    }

    document.getElementById('form-imagem').addEventListener('change', e => {
      const file = e.target.files[0];
      if (!file) return;
      abrirCropper(URL.createObjectURL(file));
    });

    async function guardarItem() {
      const nome = document.getElementById('form-nome').value.trim() || cfg.nomePadrao;
      const erro = document.getElementById('form-erro');
      const btn  = document.getElementById('btn-guardar-form');

      if (!editandoId && !ficheiroImagem) {
        erro.textContent = 'Escolhe uma imagem.';
        erro.classList.add('show');
        return;
      }

      btn.disabled    = true;
      btn.textContent = 'A guardar…';
      erro.classList.remove('show');

      try {
        let imagem_url = editandoId
          ? itemsCache.find(x => x.id === editandoId).imagem_url
          : null;

        if (ficheiroImagem) {
          const caminho = `${Date.now()}_${ficheiroImagem.name.replace(/\s+/g, '_')}`;
          const { error: erroUpload } = await sb.storage.from(cfg.bucket).upload(caminho, ficheiroImagem);
          if (erroUpload) throw erroUpload;
          imagem_url = sb.storage.from(cfg.bucket).getPublicUrl(caminho).data.publicUrl;
        }

        const payload = { legenda: nome, imagem_url };

        const { error } = editandoId
          ? await sb.from(cfg.tabela).update(payload).eq('id', editandoId)
          : await sb.from(cfg.tabela).insert(payload);

        if (error) throw error;

        fecharForm();
        await carregarItems();
      } catch (err) {
        erro.textContent = 'Erro ao guardar: ' + (err.message || err);
        erro.classList.add('show');
      } finally {
        btn.disabled    = false;
        btn.textContent = 'Guardar';
      }
    }

    // ── Arquivar / Restaurar ──
    function confirmarArquivar(id) {
      idParaArquivar = id;
      document.getElementById('modal-confirmar').classList.add('show');
    }

    function fecharConfirmar() {
      document.getElementById('modal-confirmar').classList.remove('show');
      idParaArquivar = null;
    }

    async function arquivarConfirmado() {
      if (!idParaArquivar) return;
      await sb.from(cfg.tabela).update({ ativo: false }).eq('id', idParaArquivar);
      fecharConfirmar();
      await carregarItems();
    }

    async function restaurar(id) {
      await sb.from(cfg.tabela).update({ ativo: true }).eq('id', id);
      await carregarItems();
    }

    // ── Ajustar imagem (Cropper.js) ──
    const RATIO_IMAGEM = 1080 / 1350; // igual ao .galeria-thumb do site
    let cropperInstance = null;
    let baseZoomRatio   = null;

    function abrirCropper(src) {
      if (!src) return;
      document.getElementById('modal-cropper').classList.add('show');
      const img = document.getElementById('cropper-img');
      if (cropperInstance) { cropperInstance.destroy(); cropperInstance = null; }
      baseZoomRatio = null;
      img.src = src;
      cropperInstance = new Cropper(img, {
        aspectRatio: RATIO_IMAGEM,
        viewMode: 0,
        dragMode: 'move',
        autoCropArea: 1,
        background: false,
        cropBoxMovable: false,
        cropBoxResizable: false,
        toggleDragModeOnDblclick: false,
        ready() {
          baseZoomRatio = cropperInstance.getImageData().width / cropperInstance.getImageData().naturalWidth;
          document.getElementById('cropper-zoom').value = 100;
        },
      });
    }

    document.getElementById('cropper-img').addEventListener('zoom', e => {
      if (!baseZoomRatio) return;
      const pct = Math.round((e.detail.ratio / baseZoomRatio) * 100);
      document.getElementById('cropper-zoom').value = Math.min(200, Math.max(0, pct));
    });

    document.getElementById('cropper-zoom').addEventListener('input', e => {
      if (!cropperInstance || !baseZoomRatio) return;
      cropperInstance.zoomTo(baseZoomRatio * (Number(e.target.value) / 100));
    });

    function resetarCropper() {
      if (!cropperInstance) return;
      cropperInstance.reset();
      document.getElementById('cropper-zoom').value = 100;
    }

    function cancelarCropper() {
      document.getElementById('modal-cropper').classList.remove('show');
      if (cropperInstance) { cropperInstance.destroy(); cropperInstance = null; }
      document.getElementById('form-imagem').value = '';
    }

    function aplicarCropper() {
      if (!cropperInstance) return;
      const canvas = cropperInstance.getCroppedCanvas({ width: 1080, height: 1350, fillColor: '#000' });
      if (!canvas) return;
      canvas.toBlob(blob => {
        if (!blob) return;
        ficheiroImagem = new File([blob], 'foto.jpg', { type: 'image/jpeg' });
        imagemAtualUrl = URL.createObjectURL(blob);

        document.getElementById('form-imagem-preview').src = imagemAtualUrl;
        document.getElementById('imagem-preview-row').style.display = 'flex';

        document.getElementById('modal-cropper').classList.remove('show');
        cropperInstance.destroy();
        cropperInstance = null;
        document.getElementById('form-imagem').value = '';
      }, 'image/jpeg', 0.92);
    }
  </script>
